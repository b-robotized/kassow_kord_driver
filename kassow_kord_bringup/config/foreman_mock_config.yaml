# Example command to transition states:
# ros2 service call /foreman/set_profile foreman_msgs/srv/SetProfile "{profile: 'idle'}"
#

controller_manager: b_controlled_box_cm
autostart_profile: active

hardware:
  - kassow

controllers:
  kassow_joint_trajectory_controller:
    requires: [kassow, active]
  joint_state_broadcaster:
    requires: [kassow, inactive]

profiles:

  inactive:
    controllers:
      kassow_joint_trajectory_controller: inactive
      joint_state_broadcaster: active
    hardware:
      kassow: inactive

  active:
    controllers:
      kassow_joint_trajectory_controller: active
      joint_state_broadcaster: active
    hardware:
      kassow: active
